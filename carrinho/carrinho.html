<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCommerce</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <nav class="container">
            <h1>DevCommerce</h1>
            <div>
                <img class="item-nav" src="../img/cart-fill-svgrepo-com 1.svg" alt="Carrinho de compras">
                <a id="sign-in-link" class="item-nav" href="#">Entrar</a>
            </div>
        </nav>
    </header>
    <main>
        <section id="product-cart" class="container">
            <div class="card">
                <div class="card-product">
                    <div class="card-product-left">
                        <img src="../img/image 3.png" alt="Computador Gamer XT">
                        <div class="product-name-quantity">
                            <h3>Computador Gamer XT</h3>
                            <p><span class="product-more-less">-</span> 1 <span class="product-more-less">+</span></p>
                        </div>
                    </div>
                    <div class="card-product-right">
                        <h4>R$ 5000,00</h4>
                    </div>
                </div>
                <div class="card-product">
                    <div class="card-product-left">
                        <img src="../img/image 3.png" alt="Computador Gamer XT">
                        <div class="product-name-quantity">
                            <h3>Computador Outro</h3>
                            <p><span class="product-more-less">-</span> 2 <span class="product-more-less">+</span></p>
                        </div>
                    </div>
                    <div class="card-product-right">
                        <h4>R$ 10000,00</h4>
                    </div>
                </div>
                <div class="card-total-price">
                    <h3>R$ 15000,00</h3>
                </div>
            </div>
            <div class="btn-container">
                <div class="btn btn-blue">Finalizar pedido</div>
                <div class="btn btn-white">Continuar comprando</div>
            </div>
        </section>
    </main>
</body>
</html>
