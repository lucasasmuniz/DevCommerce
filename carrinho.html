<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCommerce</title>
    <link rel="stylesheet" href="./css/cart.css">
</head>
<body>
    <header class="devc-header-client">
        <nav class="devc-container">
            <h1>DevCommerce</h1>
            <div>
                <img class="devc-item-nav" src="./img/cart-fill-svgrepo-com 1.svg" alt="Carrinho de compras">
                <a class="devc-item-nav devc-sign-in-link" href="#">Entrar</a>
            </div>
        </nav>
    </header>
    <main>
        <section id="product-cart-section" class="devc-container devc-pd-top-20">
            <div class="devc-card">
                <div class="devc-cart-product devc-line-bottom">
                    <div class="devc-cart-product-left">
                        <img src="../img/image 3.png" alt="Computador Gamer XT">
                        <div class="devc-cart-product-name-quantity">
                            <h3>Computador Gamer XT</h3>
                            <div class="devc-cart-item-quantity-container">
                                <span>-</span> 
                                <p>1</p> 
                                <span>+</span>
                            </div>
                        </div>
                    </div>
                    <div class="devc-cart-product-right">
                        <h4>R$ 5000,00</h4>
                    </div>
                </div>
                <div class="devc-cart-product devc-line-bottom">
                    <div class="devc-cart-product-left">
                        <img src="../img/image 3.png" alt="Computador Gamer XT">
                        <div class="devc-cart-product-name-quantity">
                            <h3>Computador Outro</h3>
                            <div class="devc-cart-item-quantity-container">
                                <span>-</span> 
                                <p>2</p> 
                                <span>+</span>
                            </div>
                        </div>
                    </div>
                    <div class="devc-cart-product-right">
                        <h4>R$ 10000,00</h4>
                    </div>
                </div>
                <div class="devc-cart-total-price">
                    <h3>R$ 15000,00</h3>
                </div>
            </div>
            <div class="devc-btn-container devc-mt-20">
                <div class="devc-btn devc-btn-blue">Finalizar pedido</div>
                <div class="devc-btn devc-btn-white">Continuar comprando</div>
            </div>
        </section>
    </main>
</body>
</html>
