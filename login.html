<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCommerce</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <header class="devc-header-client">
        <nav class="devc-container">
            <h1>DevCommerce</h1>
            <div>
                <img class="devc-item-nav" src="../img/cart-fill-svgrepo-com 1.svg" alt="Carrinho de compras">
                <a class="devc-item-nav devc-sign-in-link" href="#">Entrar</a>
            </div>
        </nav>
    </header>
    <main>
        <section id="login-section" class="devc-container devc-pd-top-20">
            <div class="devc-login-form-container devc-card">
                <form class="devc-form-login">
                    <h2>Login</h2>
                    <div class="devc-form-control-container">
                        <div class="devc-form-email-container">
                            <input class="devc-form-input" type="text" placeholder="Email">
                            <div class="devc-form-error"></div>
                        </div>
                        <div class="devc-form-password-container">
                            <input class="devc-form-input" type="password" placeholder="Senha">
                            <div class="devc-form-error"></div>
                        </div>
                    </div>
                    <button type="submit" class="devc-btn devc-btn-blue">Entrar</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
